version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # ایمیج‌های پایهٔ Dockerfile (sdk/aspnet) — به‌روزرسانی وصله‌های امنیتی پایه.
  - package-ecosystem: "docker"
    directory: "/Ashianebargh.App"
    schedule:
      interval: "weekly"
